<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>提示</title>
    <style>
      /* 悬浮卡片悬停时的提示窗：独立小窗口，内容由主窗口通过 tip-data 事件推过来。
         窗口不接鼠标事件（Rust 侧 ignore_cursor_events），这里只管画。 */
      :root {
        /* 与主窗口同一套家族令牌（深空底 + 霓虹青 + 紫），提示窗独立窗口也保持一致 */
        --tip-bg: linear-gradient(160deg, rgba(16, 25, 45, 0.98), rgba(4, 7, 15, 0.98));
        --tip-border: rgba(0, 214, 255, 0.22);
        --tip-text: #cfe6f5;
        --tip-dim: #6c839c;
        --tip-faint: #5b7187;
        --tip-accent: #00e5ff;
        --tip-warn: #ffd166;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
        overflow: hidden;
        /* 提示窗是纯展示的：整页都不该出现文本选择、拖拽、右键菜单 */
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      .tip {
        /* 高度交给窗口自适应（见 tooltip.js 的 fitHeight）：内容多高窗口就多高，
           footer 紧跟最后一行，行数少的平台不会在中间空出一大块 */
        height: auto;
        padding: 11px 13px;
        border-radius: 14px;
        border: 1px solid var(--tip-border);
        background: var(--tip-bg);
        /* 投影交给窗口原生的 NSWindow 阴影（tauri.conf.json 里 tip 的 shadow: true）。
           这里不能用 CSS box-shadow：窗口高度正好等于内容高度，投影落在窗口外的部分
           会被直接裁掉，只在圆角切角那一圈露出灰边，看着像脏了的方块。 */
        display: flex;
        flex-direction: column;
        color: var(--tip-text);
      }

      .tip-title {
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: var(--tip-accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tip-rows {
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .tip-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 11.5px;
        line-height: 1.35;
        font-variant-numeric: tabular-nums;
      }

      .tip-k {
        flex: 0 0 auto;
        color: var(--tip-dim);
      }

      .tip-v {
        flex: 1;
        min-width: 0;
        color: var(--tip-text);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 预计可用天数：给它一点强调色，其余行保持普通文本色 */
      .tip-row.accent .tip-v {
        color: var(--tip-accent);
      }
      .tip-row.warn .tip-v {
        color: var(--tip-warn);
      }

      .tip-sep {
        height: 1px;
        margin: 7px 0 5px;
        background: rgba(0, 214, 255, 0.14);
      }

      .tip-foot {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 10.5px;
        color: var(--tip-faint);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="tip">
      <div class="tip-title" id="tip-title">—</div>
      <div class="tip-rows" id="tip-rows"></div>
      <div class="tip-sep"></div>
      <div class="tip-foot" id="tip-foot"></div>
    </div>

    <!-- 脚本必须外置：CSP 是 script-src 'self'，内联脚本会被拦掉 -->
    <script src="tooltip.js"></script>
  </body>
</html>
