<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>唐三浪悬浮窗</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>

    <header class="topbar" data-tauri-drag-region="deep">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-text">
            <h1>唐三浪悬浮窗</h1>
            <p id="subtitle">—</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="settings-btn" title="设置数据源">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path
                d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1.03z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="refresh-btn" id="refresh-btn" title="立即刷新">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span id="refresh-text">刷新</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 场景 Tab：只列已配置的平台，点击切换当前展示的场景；悬浮态整体隐藏 -->
    <nav class="tabs hidden" id="scenario-tabs"></nav>

    <main class="content">
      <div class="status-bar">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">正在加载…</span>
        <span class="plan-badge" id="plan-badge">—</span>
        <span class="spacer"></span>
        <span id="countdown" class="countdown"></span>
        <!-- 锁定态常驻入口：任何场景都能点它去读取钥匙串里的密钥 -->
        <button class="link-btn hidden" id="connect-sm" type="button" title="连接账号：读取系统钥匙串中已保存的密钥">
          连接账号
        </button>
        <button class="pin-btn" id="pin-btn" title="定住为悬浮窗，总在最前">
          <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
            <path
              d="M14 3l7 7-2.5 2.5-1.5-1.5-4 4V19l-2 2-2.5-5.5L3 13l2-2h4l4-4-1.5-1.5z"
              fill="currentColor"
            />
          </svg>
          <span>定住</span>
        </button>
      </div>

      <div id="error-banner" class="error-banner hidden"></div>

      <section id="cards" class="cards"></section>
    </main>

    <section id="float" class="float">
      <div class="float-card" id="float-card" data-tauri-drag-region="deep">
        <div class="float-ring" id="float-ring">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle class="float-ring-bg" cx="26" cy="26" r="20" fill="none" stroke-width="6" />
            <circle
              id="float-ring-fg"
              class="float-ring-fg"
              cx="26"
              cy="26"
              r="20"
              fill="none"
              stroke-width="6"
              stroke-dasharray="125.66"
              stroke-dashoffset="125.66"
            />
          </svg>
          <!-- 环内百分比：与展开视图的圆环口径一致（已用占比），无占比的场景不显示 -->
          <div class="float-ring-pct" id="float-ring-pct"></div>
        </div>
        <div class="float-info">
          <div class="float-label">
            <span id="float-label">—</span>
            <span class="float-reset" id="float-reset">—</span>
          </div>
          <div class="float-remain">
            <span id="float-remain">—</span><span class="float-unit" id="float-unit"></span>
          </div>
          <div class="float-sub" id="float-sub">正在加载…</div>
        </div>
        <button class="float-close" id="float-close" title="取消定住">×</button>
      </div>
    </section>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop" id="settings-backdrop"></div>
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="settings-title">数据源</h2>
          <button class="icon-btn" id="settings-close" title="关闭">×</button>
        </div>

        <!-- 视图一：数据源列表 -->
        <div id="settings-list-view">
          <p class="modal-desc" id="storage-desc"></p>
          <div id="source-list" class="source-list"></div>

          <!-- 开机自启动：状态以后端读到的系统真实配置为准，不跟随前端本地缓存 -->
          <div class="setting-row" id="autostart-row">
            <div class="setting-row-main">
              <span class="setting-row-title">开机自启动</span>
              <span class="setting-row-sub" id="autostart-sub">读取中…</span>
            </div>
            <button type="button" class="ghost-btn" id="autostart-toggle" disabled>
              读取中…
            </button>
          </div>
        </div>

        <!-- 视图二：某个平台的账号管理（账号列表 + 新增 / 编辑账号表单） -->
        <div id="settings-detail-view" class="hidden">
          <!-- 自动凭证源（Trae）的只读检测信息；手动凭证平台为空 -->
          <div id="detail-info"></div>

          <p class="modal-desc" id="detail-desc"></p>

          <!-- 该平台已有的账号列表：可设为当前 / 编辑 / 删除 -->
          <div id="account-list" class="account-list"></div>
          <button type="button" class="ghost-btn account-add" id="account-add">
            + 新增账号
          </button>

          <!-- 自动凭证源（Trae）没有账号表单，刷新间隔在这里单独设置 -->
          <div id="detail-auto-interval" class="field hidden">
            <span class="field-label">自动刷新间隔（秒）</span>
            <input
              id="detail-auto-interval-input"
              type="number"
              min="5"
              max="3600"
              step="5"
              inputmode="numeric"
              autocomplete="off"
            />
          </div>

          <!-- 账号表单（新增或编辑）：账号名 + 平台凭证字段 + 刷新间隔 -->
          <div id="account-form" class="hidden">
            <div class="field">
              <span class="field-label">账号名称</span>
              <input
                id="detail-label"
                type="text"
                maxlength="24"
                placeholder="留空则用「默认账号」"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <div id="detail-fields"></div>

            <!-- 刷新间隔按账号各自保存 -->
            <div class="field">
              <span class="field-label">自动刷新间隔（秒）</span>
              <input
                id="detail-interval"
                type="number"
                min="5"
                max="3600"
                step="5"
                inputmode="numeric"
                autocomplete="off"
              />
            </div>
          </div>

          <div id="settings-msg" class="settings-msg hidden"></div>

          <div class="modal-foot">
            <button class="ghost-btn" id="detail-back" type="button">返回</button>
            <button class="ghost-btn hidden" id="detail-cancel" type="button">取消</button>
            <span class="spacer"></span>
            <button class="ghost-btn hidden" id="detail-test" type="button">测试连接</button>
            <button class="primary-btn hidden" id="detail-save" type="button">保存</button>
          </div>
        </div>

        <!-- 版本号：底部常显，便于确认当前装的是哪个构建 -->
        <p class="app-version" id="app-version">—</p>
      </div>
    </div>

    <script src="util.js"></script>
    <script src="sources/volcengine.js"></script>
    <script src="sources/deepseek.js"></script>
    <script src="sources/kimi.js"></script>
    <script src="sources/siliconflow.js"></script>
    <script src="sources/trae.js"></script>
    <script src="sources/aliyun.js"></script>
    <script src="main.js"></script>
  </body>
</html>
