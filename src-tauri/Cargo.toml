[package]
# 包名 / 可执行文件名必须是 ASCII：中文进程名在 macOS 上会让 wry 启动时解析
# CFBundle 路径崩溃（SIGSEGV，已由 crash 报告与对照实验确认）。
# 产品对外显示名（.app 名、CFBundleName/DisplayName、菜单栏文案）仍由
# tauri.conf.json 的 productName（中文）决定，与这里无关。
name = "tangsanlang-float"
version = "0.3.11"
description = "把各 AI 服务商的余额 / 用量聚合在一个常驻悬浮窗里"
authors = ["ushe-ai"]
edition = "2021"
# keyring 4.x 要求 rustc ≥ 1.88
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
# 阿里云 RPC 签名（1.0 版）用的是 HMAC-SHA1
sha1 = "0.10"
hex = "0.4"
# Trae Code 积分：解密本机 Trae CN 登录态（byteCrypto 自研格式，AES-128-CBC + SHA-512 KDF）
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
chrono = "0.4"
# 凭证存系统钥匙串（macOS Keychain / Windows 凭据管理器），见待办 E-01
keyring = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
