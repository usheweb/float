name: Release

# 推 v* 标签（如 v0.1.0）自动打包各平台安装包并上传到 Release；
# 也可以在 Actions 页面手动触发（workflow_dispatch）来试跑。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 通用包：一个 dmg 同时支持 Intel 与 M 系列芯片
          - platform: macos-latest
            label: macOS universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin

          # Windows 64 位：输出 NSIS 安装包（*_x64-setup.exe）
          - platform: windows-latest
            label: Windows x64
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 本项目 UI 是纯静态文件（ui/），没有前端构建步骤；
      # 这里装依赖只是为了给 tauri-action 提供 @tauri-apps/cli（npm run tauri）。
      # 必须显式用官方源：GitHub runner 在海外，npm 会照 package-lock.json 里
      # 记的 resolved 地址去下载，本仓库的 lock 已统一指向官方源；
      # 若哪天又混进国内镜像，这里也能兜住，避免 runner 拉包超时（504）。
      - name: Install frontend deps
        run: npm install --registry=https://registry.npmjs.org

      # 资产名默认直接沿用产品名，而产品名是纯中文，GitHub 会把非 ASCII 字符剥掉、
      # 只剩前导下划线（如 _0.2.0_universal.dmg）。这里改成
      # 「包名(identifier)最后一段 + 版本 + 架构」命名，例如 floating_0.2.0_universal.dmg。
      - name: Resolve asset prefix
        id: asset-prefix
        shell: bash
        run: |
          prefix=$(node -p "require('./src-tauri/tauri.conf.json').identifier.split('.').pop()")
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "资产名前缀：$prefix"

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 唐三浪悬浮窗 v__VERSION__
          # 注意：tauri-action@v0 的输入名是 assetNamePattern
          # （dev 分支已改名为 releaseAssetNamePattern，升级时需同步）
          # [version] [arch] [setup] [ext] 由 action 按产物填充；[setup] 仅 nsis 安装包有值
          assetNamePattern: ${{ steps.asset-prefix.outputs.prefix }}_[version]_[arch][setup][ext]
          releaseBody: |
            唐三浪悬浮窗 v__VERSION__：把各个 AI 服务商的余额 / 用量聚合在一个悬浮窗里。

            本版更新：
            - **统一版本号**：上一版安装包里设置面板显示的是 v0.3.12（Cargo.toml 里的版本
              没跟着升，而界面读的正是它），与安装包文件名 v0.3.13 对不上。本版把四处版本号
              对齐，界面显示的版本与安装包一致
            - **设置页新增「开机自启动」开关**：设置面板「数据源」列表底部多了一行
              开机自启动，按钮就是「开启自启动 / 取消自启动」；开关状态以后端读到的
              系统真实配置为准，不用前端本地记忆，不会出现界面显示已开启、系统里其实没写
              的情况。macOS 写 LaunchAgent 项、Windows 写注册表 Run 项、Linux 写
              ~/.config/autostart，对应平台各自生效
            - **修复 Windows 上悬浮卡副标题仍被省略号截断**：量宽时只把卡片设成
              max-content 不够 —— 卡片里 .float-info 是 flex:1 子项，在容器的 max-content
              计算里按 flex-basis(0) 参与，内容宽度被算漏，量出来的值比实际需要窄一截
              （Windows 实测量到 194、实际需要 208），窗口照量值收缩后副标题就被省略号吃掉。
              所以上一版把 Windows 宽度上限从 320 抬到 384 也没起作用（量值根本没碰到上限）。
              现在量宽时同时把 .float-info 按内容定宽、量完再还原，并在窗口缩到位后补一道
              落地校验：按 scrollWidth - clientWidth 量真实截断缺口，还有缺口就加宽并把差额
              记进累计补偿，避免下次刷新又缩回去、来回跳
            - **设置面板间距调整**：Trae 设置页与其它密钥平台的多账号设置页整体放宽了
              间距（字段名与输入框、输入框与旁边的按钮、底部按钮之间），不再挤在一起；
              窄窗口下账号行的「设为当前 / 编辑 / 删除」放不下时会自动换行，不再互相挤压
            - **Trae 设置页新增「自动刷新间隔（秒）」**：Trae 是自动读取本机登录态的数据源，
              此前没有账号表单，也就没有地方改刷新间隔（一直是默认 60 秒）。现在它的详情页
              单独提供一个间隔输入框和「保存设置」按钮，改完立即生效、与其它平台一样存本机
            - **Windows 定住后从任务栏消失**：悬浮窗已经挂在桌面上了，任务栏再留一个入口
              是多余的。定住时摘掉任务栏按钮（走 ITaskbarList 的 DeleteTab，只摘按钮、
              不动窗口本身，所以不影响收缩动画），取消定住回到普通窗口时再还回来
            - **修复 Windows 上「点悬浮卡刷新点了没反应」**：定住态的悬浮卡此前用的是
              Tauri 默认的「按下即拖」，Windows 下这条走的是系统模态拖拽循环，鼠标松开的
              消息在那个循环里就被吃掉，网页永远收不到 click —— 所以点一下没反应，偶尔
              数字变了其实是自动刷新。现在 Windows 改成指针真的移动了（超过 5px）才把
              窗口交给系统去拖，没移动就按普通点击走刷新；macOS 保持按下即拖不变
            - **Windows 悬浮卡宽度上限放宽**（320 → 384）：Windows 字体回退到微软雅黑，
              同样的文案比 macOS 宽一截，原上限会把 Trae 带天数的副标题（…天（MM-DD 重置））
              截成省略号。macOS 文案本就放得下，仍保持 320 不动
            - **设置面板底部显示版本号**：启动时 Rust 把编译进二进制的包版本带回前端，
              在设置面板最底部常显「唐三浪悬浮窗 vX.Y.Z」，方便确认当前装的是哪个构建
            - **修复 Windows 上没有悬停提示窗**：Windows 专属配置 tauri.windows.conf.json 里
              只声明了主窗口一个窗口，而 Tauri 合并平台配置用的是 JSON Merge Patch、
              数组是「整体替换」，于是提示窗口在 Windows 打包时被整个顶掉，主窗口调用
              show_float_tip 时拿不到它、直接返回「找不到提示窗口」，悬停自然什么都没有。
              现在把提示窗按 Windows 的实际情况补回该配置里
            - **Windows 悬浮窗恢复透明圆角**：此前 Windows 窗口不透明，WebView 白底会从四个
              圆角透出「白角」，所以改成直角 + 铺满不透明深色底。现在 main 窗口也开了
              transparent 并加 noRedirectionBitmap 防白闪，圆角与 macOS 一致；提示窗同样
              走透明窗口（并关掉原生阴影，避免 Windows 下 undecorated 窗口那条 1px 白边）
            - **签到结论按天缓存在本机**：Trae 的「今天」是按本地时区零点翻页的（已实测确认），
              所以当天一旦确认出结论（已签到 / 签到没开放）就不再打签到状态接口，一天最多问一次；
              领取没成功则隔 30 分钟再试一次，「今天没签上」也不会跟着自动刷新间隔反复打领取接口
              （退避是刻意的：服务端一直说没签、而领取接口又一直失败时，若按 60 秒的刷新周期重试，
              通宵开着就是几百上千次请求，最容易踩平台风控；退避后当天仍有机会补上签到）。
              换电脑不受影响：新机器第一次打开会问一次服务端，拿到结论后同样按天缓存
            - 修复悬浮卡片悬停提示窗在数据刷新时「闪一下就没」的问题，两个根因都堵掉了：
              一是刷新结束时前端会把提示窗内容再推一次，此前这会让已经显示着的窗口重新摆位、
              重新显示一遍（macOS 上就是明显闪一下），现在这种「已显示」的情况只更新数字、
              不再动窗口；二是网页层偶尔收不到真正的 mouseleave（看门狗就是为此加的兜底），
              窗口被看门狗按光标位置收起后前端仍以为它开着，于是每次刷新都会在光标早已离开
              卡片时把提示窗重新弹一下、200ms 后再被看门狗收走，现在窗口已不可见且光标不在
              卡片上时直接不显示。另外，提示窗尺寸 / 位置没变化时不再重复 set_size
            - **Trae 自动签到**：打开悬浮窗取积分时顺手查一次签到状态，当天没签过就自动领取，
              签过的直接跳过、不会重复领；签到结果显示在积分卡第三行和悬停提示窗的「签到」行
            - **多账号支持**：除 Trae 积分（自动读取本机登录态，天然一份）外，所有需要手填密钥的
              平台都可以保存多个账号，例如「阿里云 · 主号」「阿里云 · 备号」
            - 每个账号一个 Tab，Tab 上显示「平台名 · 账号名」；账号名自己起，留空就是「默认账号」
            - 设置页改为「账号管理」：列出该平台的全部账号，可新增、编辑、删除、设为当前
            - 每个账号各自保存自动刷新间隔，互不影响
            - 升级后会自动把 v0.2.x 里按平台保存的凭证迁移成该平台的「默认账号」，
              密钥原样保留、不会被覆盖；迁移只在首次点「连接账号」时执行一次
            - 老版本已保存凭证的平台，升级后未连接时仍显示为「已保存 · 待连接」，不会误判成「未配置」
            - 修复 v0.3.0 升级后「上一次数据」缓存失效的问题：旧缓存按平台 id 存，账号 id 变了
              之后对不上，取数失败时会直接显示「暂无数据」；现在会自动迁移旧缓存并正常回落
            - 取数失败时不再把已有数据换成空占位卡，改为保留上一次成功的数据并提示「显示上次数据」
            - 修复悬浮卡片悬停提示窗经常「鼠标移开了还挂着」的问题：改为按系统光标的真实
              坐标判断，指针一旦离开卡片就自动收起，不再只依赖网页的 mouseleave

            支持的数据源：Trae 积分（自动读取本机 Trae CN 登录态）、火山方舟 Agent Plan、DeepSeek、Kimi 月之暗面、硅基流动、阿里云。

            下载对应平台安装包即可：
            - Windows：`*_x64-setup.exe`（双击安装）
            - macOS：通用 dmg，同时支持 Intel 与 Apple 芯片

            首次启动后在界面右上角「设置」里录入各平台的密钥即可使用；
            凭证保存在本机系统钥匙串，不落明文、不会上传。启动时不会请求钥匙串授权，
            需要读取密钥时点界面上的「连接账号」按钮再授权。

            > macOS 首次打开若提示「无法验证开发者」，是因为安装包未做 Apple 公证。
            > 把 app 拖进「应用程序」后执行一次下面这条命令即可（只需一次）：
            > `xattr -dr com.apple.quarantine "/Applications/唐三浪悬浮窗.app"`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
